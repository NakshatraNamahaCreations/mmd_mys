<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />

    <!-- Apple Touch Icon -->
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Google Fonts - limit weights to only what you use (example: 400,600) -->
    <!-- keep display=swap to avoid blocking text rendering -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />

    <!-- Bootstrap CSS (load normally; it's small and needed for initial rendering) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />

    <!-- Font Awesome - keep ONE, or better: remove if you switch to react-icons -->
    <!-- If you only use a few icons switch to react-icons (recommended). Otherwise keep a single CDN link -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" />

    <!-- If you have a large custom main CSS from React build, let the build inject it.
         To reduce blocking, you can later change your bundler to inline critical CSS
         and load the rest with preload+onload (see notes below). -->
  </head>

  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <!-- Move JavaScript to the end of body and use defer/async where possible -->

    <!-- Bootstrap JS: use defer (so it doesn't block initial parsing/paint).
         If your code needs Bootstrap JS immediately after load, you can keep it,
         otherwise you can lazy-load it. -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" defer></script>

    <!-- Third-party trackers (LinkedIn, Twitter) - load async and after page load if possible -->
    <script>
      // Delay heavy tracking scripts until after onload to avoid blocking LCP
      window.addEventListener('load', function () {
        // LinkedIn Insight (load async)
        (function() {
          var _linkedin_partner_id = "7447820";
          window._linkedin_data_partner_ids = window._linkedin_data_partner_ids || [];
          window._linkedin_data_partner_ids.push(_linkedin_partner_id);

          var s = document.getElementsByTagName("script")[0];
          var b = document.createElement("script");
          b.type = "text/javascript";
          b.async = true;
          b.src = "https://snap.licdn.com/li.lms-analytics/insight.min.js";
          s.parentNode.insertBefore(b, s);
        })();

        // Twitter tracking (load async)
        (function(e,t,n,s,u,a){
          e.twq||(s=e.twq=function(){s.exe?s.exe.apply(s,arguments):s.queue.push(arguments);},
          s.version='1.1',s.queue=[],u=t.createElement(n),u.async=!0,u.src='https://static.ads-twitter.com/uwt.js',
          a=t.getElementsByTagName(n)[0],a.parentNode.insertBefore(u,a));
        })(window,document,'script');
        // initialize your twitter pixel config after script loads
        window.twq && window.twq('config','onik3');
      });
    </script>

    <!-- LinkedIn fallback pixel image (non-blocking) -->
    <noscript>
      <img height="1" width="1" style="display:none;" alt=""
           src="https://px.ads.linkedin.com/collect/?pid=7447820&fmt=gif" />
    </noscript>

    <!-- OPTIONAL: Lazy-load other widgets (elfsight, chat widgets) inside React using IntersectionObserver -->
  </body>
</html>
